# Time-series ("dynamic") ODMR training dataset — v2
#
# Scale run of sequence_train_v1: ~4x the sequences (3072 vs 768), new master
# seed with per-sequence seeds disjoint from v1's, recipe otherwise FROZEN.
# Every physics, trajectory, contrast, and grid parameter below is identical
# to configs/sequence_train_v1.yaml — v2 is a data-scale lever, not a
# redesign. See that file's header for the full design rationale (isotropic
# family-mixed sweeps, +/-1.4 mT envelope containment proof, min-projection
# guard, contrast asymmetry + drift).
#
# Grid stays pinned to sequence_sanity_v0's exact window and F=951, so v0,
# v1, and v2 all share bit-identical input dimensionality — no distribution
# shift across lineages.
#
# Deterministic like v0/v1: no measurement noise in the stored spectra.
# Consumers apply nv_sensor_sim.physics.shot_noise at train/eval time.
# Hyperfine (L=24 / line_mI) stays deferred.
#
# Consumed by odmr-vector-tracking (per-axis-identity tracking through crossings).
# Regenerate:
#   python scripts/generate_sequence_dataset.py \
#     --config configs/sequence_train_v2.yaml \
#     --output-dir artifacts/datasets/sequence_train_v2/

# Splits (sequences, not frames) + seed — the ONLY deltas from v1
n_train: 2048
n_val: 512
n_test: 512
master_seed: 20260702    # v1 used 20260701; derived seed sets verified disjoint

# Time axis
n_timesteps: 256          # T frames per sequence
dt_s: 1.0e-3              # 1 kHz notional CW frame rate

# Sample / linewidth (fixed across the dataset; sets Gamma for labeling)
p1_ppm: 40.0             # Gamma ~ 1.5 MHz FWHM (intrinsic; rendered lines are
temperature_K: 300.0     # power-broadened ~4.9% wider at s0=0.1, mw_scale=1)

# Static bias (deployment prior — FIXED, identical to v0/v1;
# lab frame = bias_B0_T * normalize(uvw))
bias_B0_T: 5.0e-3
bias_direction_uvw: [0.2, 0.1, 1.0]

# Swept external field: per-sequence isotropic trajectory-family mixture, all
# within the +/-1.4 mT envelope (identical to v1):
#   held     (50%) — hold-ramp-hold as in the base design
#   reversal (25%) — ramp out, turn around at a uniform-random frame in the
#                    middle 60%, ramp back at a generally different rate
#   ou       (25%) — held ramp plus a seeded OU field perturbation
#                    (sigma 45 uT, tau 16 frames)
sweep_mode: isotropic
sweep_scalar_range_T: [-1.4e-3, 1.4e-3]
min_sweep_delta_T: 1.0e-3     # |s_end - s_start| >= 1 mT: every sequence moves
min_ramp_window_frac: 0.25    # ramp spans >= 25% of T; holds outside
min_axis_projection_T: 0.4e-3 # reject ramps entering the projection-zero regime
jitter_frac: 0.05             # per-sequence endpoint jitter (of ramp length)
trajectory_family_weights:
  held: 0.5
  reversal: 0.25
  ou: 0.25
reversal_turn_frac_range: [0.2, 0.8]
field_ou_sigma_T: 45.0e-6
field_ou_tau_frames: 16.0

# Per-axis contrast asymmetry + seeded AR(1) drift (identical to v1; see v1
# header for the deployment-prior rationale and why drift stays ON)
axis_contrast_scale: [1.0, 0.85, 0.7, 0.55]
axis_contrast_drift_std: 0.05         # per-sequence AR(1) drift (fractional)
axis_contrast_drift_tau_frames: 64.0  # drift correlation time (frames)

# Labelling
collision_threshold_linewidths: 1.0   # k in |f_i - f_j| < k * Gamma_intrinsic
extra_b_perp_T: 0.0
hyperfine: false         # L = 8 electronic lines (24 with 14N — deferred)

# Frequency grid: PINNED to sequence_sanity_v0's exact grid (bar parity).
# Generation fails fast if the sweep's derived worst-case window exceeds it.
freq_range_Hz: [2667390522.8636284, 3074609477.1363726]
n_freq_points: 951
freq_margin_factor: 1.15
aliasing_safety: 3.5
