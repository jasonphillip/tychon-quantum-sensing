# Production parameter sweep for CW ODMR synthetic dataset
# Grid: 7 P1 values x 5 temperatures x 3 replicates = 105 spectra

n_freq_points: 2000
freq_range_Hz: [2.82e9, 2.92e9]

# B-field configuration (Earth's field magnitude along z-axis)
B_field_T: [0.0, 0.0, 50.0e-6]

# Grid sweep axes
p1_sweep_ppm: [1, 5, 10, 50, 100, 200, 300]
temperature_sweep_K: [280, 290, 300, 310, 320]

# Corruption parameter ranges (sampled uniformly per spectrum)
b1_gradient_range: [0.05, 0.30]
b_perp_range_T: [0.0, 50.0e-6]

# Replicates per grid combination
n_replicates: 3

# Reproducibility
master_seed: 42

# Output
output_format: h5

# Physics options
include_nitrogen: false
use_optics: false
inhomogeneous_fwhm_hz: 0.0
base_saturation_s0: 0.1
