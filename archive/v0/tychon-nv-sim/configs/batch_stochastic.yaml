# Batch generation with OU stochastic noise on T(t) and B1(t).
#
# Temperature and MW power are sampled from Ornstein-Uhlenbeck trajectories
# (temporally correlated drift) instead of uniform random sampling.
# All other parameters (p1, b1_gradient, b_perp, Bz) remain uniformly sampled.

noise_mode: stochastic

# Spectral parameters
n_freq_points: 2000
freq_range_Hz: [2.82e9, 2.92e9]

# Uniformly sampled parameter ranges
p1_range_ppm: [1.0, 300.0]
b1_gradient_range: [0.05, 0.30]
b_perp_range_T: [0.0, 50.0e-6]
bz_range_T: [0.005, 0.015]

# OU noise configuration
ou_noise:
  theta_T: 0.1        # T mean reversion rate (1/s)
  mu_T: 300.0         # T long-term mean (K)
  sigma_T: 0.5        # T volatility (K/sqrt(s))
  theta_B1: 1.0       # B1 mean reversion rate (1/s)
  mu_B1: 1.0          # B1 long-term mean (normalized)
  sigma_B1: 0.05      # B1 volatility (fractional/sqrt(s))
  trajectory_dt_s: 1.0  # Time between successive spectra (s)
  enable_thermal_noise: true
  enable_mw_noise: true

# Split sizes
n_train: 1000
n_val: 200
n_test: 200
master_seed: 42

# Physics options
include_nitrogen: false
use_optics: false
