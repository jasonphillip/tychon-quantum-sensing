# Field-cone eval dataset — sequence_eval_fieldcone_v1
#
# Held-out (off-bias angle x |B|) ladder that measures the tracker's field
# acquisition across and BEYOND the sequence_train_v3 widened envelope (dispatch
# Amendment 1, Deliverable 2). Eval-only (all sequences in the `test` split),
# contract v1, stored NOISELESS, grid pinned to v1. Fresh master seed disjoint from
# v3-train/v1/v2.
#
# Three bucket classes (12 sequences each):
#   failure — the exact increment-5 cross-axis merge geometries (pairs (0,2)/(4,6));
#             the field passes through the true degeneracy.
#   control — in-envelope (angle, |B|) strata the tracker should lock on; calibrates
#             the eval against the widened training cone.
#   beyond  — probes PAST the training walls: off-bias angle > ~62 deg (the widened
#             cone) and/or |B| < 3.0 mT (the training floor). Measures the boundary.
#
# The |B| floor and angle cap are deliberately NOT enforced here (the beyond probes
# must exceed them). The min-per-axis-projection guard (label validity) and window
# containment (pinned grid) DO apply; a bucket that cannot fit the pinned window at
# valid projections is stop-and-reported, not silently dropped.
#
# Regenerate:
#   python scripts/generate_fieldcone_dataset.py \
#     --config configs/sequence_eval_fieldcone_v1.yaml \
#     --output-dir artifacts/datasets/sequence_eval_fieldcone_v1/

master_seed: 20260713
seqs_per_bucket: 12
azimuth_sweep_deg: 20.0

n_timesteps: 256
dt_s: 1.0e-3
p1_ppm: 40.0
temperature_K: 300.0

bias_B0_T: 5.0e-3
bias_direction_uvw: [0.2, 0.1, 1.0]

# Label-validity + grid guards (no |B| floor / angle cap — beyond probes exceed them).
min_axis_projection_T: 0.4e-3
window_margin_frac: 0.02

# Per-axis contrast ladder + AR(1) drift — identical to v1/v2/v3.
axis_contrast_scale: [1.0, 0.85, 0.7, 0.55]
axis_contrast_drift_std: 0.05
axis_contrast_drift_tau_frames: 64.0
collision_threshold_linewidths: 1.0

# Physics cues OFF (baseline eval).
axis_offsets_hz: null
nv_density_ppm: 0.0

# Frequency grid: PINNED to v1's exact window/F.
freq_range_Hz: [2667390522.8636284, 3074609477.1363726]
n_freq_points: 951

# (off-bias angle x |B|) ladder.
bucket_spec:
  # Failure: exact (0,2) [~41.5 deg / 3.9 mT] and (4,6) [~53.2 deg / 3.3 mT] merges.
  - {class: failure, pair: [0, 2]}
  - {class: failure, pair: [4, 6]}
  # Control: in-envelope strata (the tracker should lock).
  - {class: control, angle_deg: 10.0, B_mT: 5.0}
  - {class: control, angle_deg: 30.0, B_mT: 4.5}
  - {class: control, angle_deg: 45.0, B_mT: 4.0}
  - {class: control, angle_deg: 52.0, B_mT: 3.6}
  # Beyond: past the widened angle cone (> ~62 deg).
  - {class: beyond, angle_deg: 66.0, B_mT: 3.6}
  - {class: beyond, angle_deg: 70.0, B_mT: 3.3}
  # Beyond: below the 3.0 mT training floor.
  - {class: beyond, angle_deg: 40.0, B_mT: 2.5}
  - {class: beyond, angle_deg: 50.0, B_mT: 2.0}
