# 1,000-spectrum sanity slice for fixed 2 mT bias plus ambient field.
# Validates schema and multi-axis lineshape before the full v4 bias cut.

# Split sizes (sanity slice: ~700 train / 150 val / 150 test ≈ 1000)
n_train: 700
n_val: 150
n_test: 150
master_seed: 1717

# Spectral parameters retained from the v3 vector sanity config.
n_freq_points: 800
freq_range_Hz: [2.83e9, 2.91e9]

# Vector-readiness mode
multi_axis_mode: true
field_sampling: bias_plus_ambient

# Ambient field magnitude around the fixed bias.
b_mag_range_T: [0.0, 200.0e-6]

# Fixed lab-frame bias metadata.
bias_B0_T: 2.0e-3
bias_direction_uvw: [0.2, 0.1, 1.0]
concentrator_amplification: 1.0
magnet_drift_ppm_per_K: 0.0

# Corruption parameter ranges (per-spectrum uniform sampling)
p1_range_ppm: [1.0, 300.0]
temp_range_K: [280.0, 320.0]
b1_gradient_range: [0.05, 0.30]
# In multi-axis mode b_perp_range_T is *extra* transverse field beyond the
# geometric per-axis projection of B_lab. Keep small.
b_perp_range_T: [0.0, 10.0e-6]

# Physics options
include_nitrogen: false
use_optics: false

# Output
output_format: h5
